name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: kuvatin
          POSTGRES_USER: kuvatin
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuvatin -d kuvatin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kuvatin:test-password@localhost:5432/kuvatin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:migrate
      - run: npm run embedding:types
      - run: npm run typecheck
      - run: npm test

  multimodal-embedding-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/multimodal-embeddings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/multimodal-embeddings/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
