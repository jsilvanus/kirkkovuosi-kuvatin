services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: kuvatin
      POSTGRES_USER: kuvatin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuvatin -d kuvatin"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
