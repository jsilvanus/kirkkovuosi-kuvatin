[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuvatin-multimodal-embeddings"
version = "0.1.0"
description = "Queued multilingual image/text embeddings for Kirkkovuosi-Kuvatin"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sentence-transformers>=5.0,<6",
  "Pillow>=10.4,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["multimodal_embeddings*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
